<!doctype html><html lang="sw"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fedha · agent.</title><style>*{box-sizing:border-box}body{--bg:#f7f9f8;--panel:#fff;--text:#233d38;--sub:#60716b;--edge:#e8eeeb;--mint:#207568;--bar:#207568;--soft:#edf5f1;margin:0;color-scheme:light;background:var(--bg);color:var(--text);font:14px/1.45 Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}body.night{--bg:#10211d;--panel:#192c27;--text:#e2eee8;--sub:#9cafa6;--edge:#2d4239;--mint:#72bbaa;--bar:#72bbaa;--soft:#233d33;color-scheme:dark}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:3px solid #93cba7;outline-offset:2px}header{background:var(--panel);border-bottom:1px solid var(--edge)}.wrap{width:min(100% - 36px,900px);margin:auto}.top,.brand,.controls,.line,.actions,.legend,.tabs{display:flex;align-items:center}.top,.line{justify-content:space-between}.top{height:62px}.brand{gap:9px;font-size:27px;letter-spacing:-1.6px;font-weight:750}.mark{display:grid;grid-template-columns:repeat(2,7px);gap:3px;padding:9px;background:#207568;border-radius:9px}.mark i{height:7px;border:1.4px solid white;border-radius:2px}.brand b{color:var(--mint);margin-left:-9px}.controls{gap:12px}.theme{border:0;background:transparent;width:44px;height:44px;font-size:23px}.avatar{border-radius:50%;padding:8px;background:var(--soft);color:var(--mint);font-size:12px;font-weight:bold}.eye{color:var(--mint);font:600 10px Arial;letter-spacing:1.6px}.eye:before{content:'';display:inline-block;margin:0 7px 2px 0;width:5px;height:5px;border-radius:50%;background:currentColor}main{padding:23px 0 25px}h1{font-size:clamp(29px,5vw,38px);letter-spacing:-1.25px;margin:6px 0 0;line-height:1.2}.intro{margin:5px 0 18px;color:var(--sub)}.hero{border-radius:15px;overflow:hidden;background:#1d6c60;color:white;position:relative;isolation:isolate}.hero:after{content:'';position:absolute;z-index:-1;right:-40px;top:-52px;width:175px;height:175px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,transparent 0 9px,#d7f1df26 10px,transparent 11px)}.hero-main{padding:18px 20px 15px}.period{font-size:10px;letter-spacing:1.6px;font-weight:bold;color:#dfefe3}.profit{margin-top:15px;font-size:14px}.big{font-size:clamp(30px,7.7vw,44px);font-weight:600;line-height:1.18;letter-spacing:-1.5px}.big small{font-size:17px;letter-spacing:0;font-weight:400;color:#ddf0e5}.split{display:grid;grid-template-columns:1fr 1fr;background:#0b473b66;border-top:1px solid #ffffff24;padding:13px 20px;gap:12px}.split>div+div{border-left:1px solid #ffffff38;padding-left:16px}.split small{color:#e1eee6}.split strong{display:block;font-size:16px;margin-top:2px}.actions{gap:10px;margin:12px 0 20px}.actions button,.save{flex:1;border:1px solid var(--edge);background:var(--panel);border-radius:9px;min-height:44px;font-size:13px;font-weight:600}.actions button:first-child,.save{background:#c5e4cb;color:#183d2f;border-color:transparent}.panel{border-radius:13px;border:1px solid var(--edge);padding:18px;background:var(--panel)}h2{font-size:17px;margin:0;letter-spacing:-.4px}.sub{color:var(--sub);font-size:12px;margin:3px 0 0}.tabs{gap:3px;padding:3px;background:var(--bg);border-radius:7px;margin:14px 0}.tabs button{flex:1;min-height:38px;background:none;border:0;border-radius:5px;font-size:13px}.tabs [aria-pressed=true]{background:var(--soft);color:var(--mint);font-weight:700}.graph{height:96px;display:flex;align-items:flex-end;gap:6%;padding:0 6%;border-bottom:1px solid var(--edge);background:repeating-linear-gradient(to top,transparent 0 31px,var(--edge) 31px 32px)}.group{height:100%;flex:1;display:flex;gap:3px;align-items:flex-end;justify-content:center}.bar{width:min(16px,40%);border-radius:3px 3px 0 0;background:var(--bar)}.bar.prev{background:var(--sub);opacity:.65}.ticks{display:flex;text-align:center;color:var(--sub);font-size:11px;padding-top:5px}.ticks span{flex:1}.legend{gap:14px;margin-top:13px;color:var(--sub);font-size:11px}.legend span:before{content:'';display:inline-block;width:8px;height:8px;background:var(--bar);margin-right:5px;border-radius:2px}.legend span+span:before{background:var(--sub)}.detail{margin-top:14px}.detail .line{padding:12px 0;border-bottom:1px solid var(--edge);gap:8px}.detail .line:last-child{border:0;padding-bottom:0}.demo{margin:15px 0 0;color:var(--sub);font-size:12px}dialog{width:min(92vw,370px);background:var(--panel);color:var(--text);border:1px solid var(--edge);border-radius:14px;padding:20px}dialog::backdrop{background:#06120fc9}dialog form,dialog label{display:grid;gap:8px}dialog form{gap:14px}input{width:100%;border:1px solid var(--edge);border-radius:8px;background:var(--bg);color:var(--text);padding:12px;font-size:16px}.close{background:none;color:inherit;border:0;min-width:44px;height:44px;font-size:22px}@media(min-width:700px){.lower{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}.detail{margin-top:0}.hero-main{padding:24px}.actions{max-width:410px}.top{height:72px}}@media(max-width:320px){.wrap{width:calc(100% - 22px)}.split{padding:12px}.split strong{font-size:14px}}.hero{background:#1d6c60 radial-gradient(ellipse at 70% 170%,#388676 0%,transparent 65%);box-shadow:0 7px 20px #164f4010}.hero:after{content:none}.panel{box-shadow:0 3px 8px #21473202}.brand{font-size:30px;letter-spacing:-1.5px}.avatar{width:37px;height:37px;display:grid;place-items:center;padding:0;background:#e6efe8;color:#38735b;border:3px solid var(--panel);outline:1px solid var(--edge)}.eye{letter-spacing:1.8px}.intro{font-size:13px}h1{font-size:clamp(27px,5vw,32px);font-weight:550;letter-spacing:-1.15px}h2{font-size:15px;font-weight:550}.actions button:first-child,.save{background:var(--mint);color:var(--panel)}.theme{color:var(--sub)}.theme svg{width:20px;vertical-align:middle}.sun,.night .moon{display:none}.night .sun{display:inline}@media(min-width:900px){.wrap{width:min(100% - 80px,1136px)}.top{height:88px}main{padding-top:47px}.panel{padding:24px 26px}.lower{grid-template-columns:1.2fr 1fr;gap:23px}} </style><body><header></header><main class="wrap"><h1>Dashibodi ya fedha</h1><p class="intro">Mapato, matumizi na faida yako kwa mwezi huu.</p><section class="hero"><div class="hero-main"><div class="period">NOVEMBA 2026</div><div class="profit">Faida halisi</div><div class="big"><small>TSh</small> <span id="net"></span></div></div><div class="split"><div><small>↗ Mapato</small><strong id="income"></strong></div><div><small>↘ Matumizi</small><strong id="cost"></strong></div></div></section><div class="actions"><button data-entry="income">＋ Ongeza mapato</button><button data-entry="cost">＋ Ingiza gharama</button></div><div class="lower"><section class="panel"><h2>Mwenendo wa mapato</h2><p class="sub" id="hint"></p><div class="tabs" aria-label="Kipindi"><button id="weekly" aria-pressed="true">Kwa wiki</button><button id="monthly" aria-pressed="false">Kwa mwezi</button></div><div class="graph" role="img"></div><div class="ticks" aria-hidden="true"></div><div class="legend"><span id="current"></span><span id="previous"></span></div></section><section class="panel detail"><h2>Muhtasari wa mwezi</h2><div class="line"><span>Jumla ya mapato</span><b id="all"></b></div><div class="line"><span>Wastani kwa siku</span><b id="avg"></b></div><p class="sub">Wastani wa siku 19 za Novemba.</p></section></div></main><dialog><form><div class="line"><h2 id="action"></h2><button class="close" type="button" aria-label="Funga">×</button></div><label>Kiasi (TSh)<input required type="number" min="1" max="999999999" step="1"></label><button class="save">Hifadhi kwenye mfano</button></form></dialog><script>const $=s=>document.querySelector(s),money=n=>'TSh '+Math.round(n).toLocaleString('en-US');let income=5100000,cost=0,monthly=false,kind;function draw(){const a=monthly?[2400000,3150000,2900000,3600000,income]:[1000000,2500000,income-3500000,0],b=monthly?[0,0,0,0,0]:[700000,1600000,800000,500000],labels=monthly?['Jul','Ago','Sep','Okt','Nov']:['Wiki 1','Wiki 2','Wiki 3','Wiki 4'],max=Math.max(...a,...b,1);$('#net').textContent=(income-cost).toLocaleString('en-US');$('#income').textContent=$('#all').textContent=money(income);$('#cost').textContent=money(cost);$('#avg').textContent=money(income/19);$('#hint').textContent=monthly?'Julai hadi Novemba 2026':'Novemba ikilinganishwa na Oktoba';$('#current').textContent=monthly?'Mapato ya mwezi':'Novemba';$('#previous').textContent='Oktoba';$('#previous').hidden=monthly;$('.graph').innerHTML=a.map((v,i)=>`<div class="group"><i class="bar" style="height:${100*v/max}%"></i>${monthly?'':`<i class="bar prev" style="height:${100*b[i]/max}%"></i>`}</div>`).join('');$('.graph').setAttribute('aria-label',labels.map((v,i)=>v+': '+money(a[i])+(monthly?'':', Oktoba '+money(b[i]))).join('; '));$('.ticks').innerHTML=labels.map(l=>`<span>${l}</span>`).join('');$('#weekly').setAttribute('aria-pressed',!monthly);$('#monthly').setAttribute('aria-pressed',monthly)}$('#weekly').onclick=()=>{monthly=false;draw()};$('#monthly').onclick=()=>{monthly=true;draw()};document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{kind=b.dataset.entry;$('#action').textContent=kind==='income'?'Ongeza mapato':'Ingiza gharama';$('form').reset();$('dialog').showModal()});$('.close').onclick=()=>$('dialog').close();$('form').onsubmit=e=>{e.preventDefault();let n=$('input').valueAsNumber;if(kind==='income')income+=n;else cost+=n;draw();$('dialog').close();$('.demo').textContent='Imeongezwa kwenye mfano huu pekee.'};draw();</script></body></html>
