# Core auth flows — passwordless phone + OTP. Stage OTP is 0000.
tests:
  - displayName: Login with phone and OTP
    id: host-login
    steps:
      - goal: Open the app and reach the Login screen
        hint: Dismiss onboarding if this is a fresh install by completing or skipping intro screens until Login appears. Do not register a new account. Login is phone-only — there is no password field.
        finalScreenAssertion: The Login screen is visible with a phone number field and no password field
      - goal: Enter the test host phone number and tap Continue or Login
        hint: Phone uses Tanzanian format starting with 0. Tap the primary button. A sheet asks SMS or Email for the OTP. Choose SMS.
        finalScreenAssertion: OTP verification screen asking for a 4-digit code is visible
      - goal: Enter stage OTP 0000 and continue
        hint: On stage use placeholder OTP 0000. Enter four zeros and submit or wait for auto-verify.
        finalScreenAssertion: Either the main Home dashboard or PIN setup screen is visible
      - goal: Complete first-time PIN setup if prompted
        hint: If Change PIN or Set PIN screen appears enter 1234 twice to confirm. Skip this step if already on Home.
        finalScreenAssertion: The main app Home dashboard with bottom navigation is visible

  - displayName: Unlock app with PIN from welcome back screen
    id: host-pin-unlock
    prerequisiteTestCaseId: host-login
    steps:
      - goal: Send the app to background and reopen it to trigger app lock if enabled
        hint: Press home then reopen Host Bora. If Welcome Back or PIN screen appears enter PIN 1234.
        finalScreenAssertion: The Home dashboard or main shell is visible after unlock

  - displayName: Login OTP channel is SMS
    id: host-login-otp-sms
    steps:
      - goal: From Login enter a registered phone and choose SMS for the OTP
        hint: There is no Forgot Password or password field. After tapping Login, pick SMS on the channel sheet. Email is hidden when the account has no email.
        finalScreenAssertion: OTP verification screen is visible after SMS is chosen
